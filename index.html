<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScamLens — AI Anti-Scam Assistant</title>
  <style>
    /* Theme tokens & visual palette for the commercial-grade ScamLens prototype */
    :root{
      --bg: #070d19;
      --bg-elevated: #0f172a;
      --panel: rgba(22, 33, 54, 0.86);
      --panel-solid: #162136;
      --panel-inner: rgba(10, 17, 32, 0.78);
      --emerald: #10b981;
      --emerald-bright: #34d399;
      --emerald-deep: #059669;
      --cyan: #38bdf8;
      --danger: #ef4444;
      --danger-bright: #fca5a5;
      --warn: #f59e0b;
      --warn-bright: #fcd34d;
      --text: #f8fafc;
      --text-soft: #cbd5e1;
      --muted: #94a3b8;
      --line: rgba(52, 211, 153, 0.22);
      --line-subtle: rgba(148, 163, 184, 0.16);
      --glow: 0 0 28px rgba(16, 185, 129, 0.16), 0 20px 48px rgba(2, 6, 23, 0.72);
      --card-shadow: 0 8px 24px rgba(2, 6, 23, 0.36);
      --risk-low-bg: rgba(16, 185, 129, 0.16);
      --risk-low: #34d399;
      --risk-med-bg: rgba(245, 158, 11, 0.16);
      --risk-med: #fbbf24;
      --risk-high-bg: rgba(239, 68, 68, 0.16);
      --risk-high: #f87171;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(960px 540px at 50% -10%, rgba(16, 185, 129, 0.18), transparent 60%),
        radial-gradient(760px 440px at 8% 32%, rgba(56, 189, 248, 0.10), transparent 62%),
        radial-gradient(640px 420px at 92% 78%, rgba(16, 185, 129, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Outer desktop framing & inner mobile-first viewport container */
    .shell{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 12px 22px;
    }
    .phone{
      width:100%;
      max-width: 430px;
      height: 86dvh;
      max-height: 880px;
      background: linear-gradient(180deg, rgba(13, 21, 38, 0.96) 0%, rgba(8, 14, 27, 0.99) 100%);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 22px;
      box-shadow: var(--glow);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    @media (max-width: 440px){
      .shell{ padding: 0; }
      .phone{ border-radius: 0; height: 100dvh; max-height: none; border-left: none; border-right: none; }
    }
    @media (max-width: 380px){
      .scanActionRow{ flex-direction: column; }
      .scanActionRow .btn{ width: 100% !important; }
    }

    /* Top app bar with custom ScamLens shield-lens vector mark */
    header.appbar{
      padding: 13px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(11, 18, 34, 0.90));
      backdrop-filter: blur(12px);
      flex: 0 0 auto;
      z-index: 5;
    }
    .brandRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .brandTitle{ display:flex; align-items:center; gap:11px; }

    .brandIcon{
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.24), rgba(6, 78, 59, 0.55));
      border: 1px solid rgba(52, 211, 153, 0.52);
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      position: relative;
    }
    .brandIcon svg{
      width: 26px;
      height: 26px;
      display: block;
    }
    .brandIconLg{
      width: 64px;
      height: 64px;
      border-radius: 18px;
      box-shadow: 0 0 26px rgba(16, 185, 129, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .brandIconLg svg{
      width: 42px;
      height: 42px;
    }

    .brandText h1{
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin:0;
      line-height: 1.15;
      display:flex;
      align-items:center;
      gap:4px;
    }
    .brandText h1 .accent{ color: var(--emerald-bright); }
    .brandText .sub{
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }
    .statusPill{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--emerald-bright);
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.38);
      padding: 5px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pulseDot{
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--emerald-bright);
      box-shadow: 0 0 8px var(--emerald-bright);
    }

    /* Scrollable main view area with subtle dark scrollbar & bottom clearance */
    main{
      padding: 16px 15px 104px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      scroll-behavior: smooth;
      display:flex;
      flex-direction:column;
      scrollbar-width: thin;
      scrollbar-color: rgba(52, 211, 153, 0.24) transparent;
    }
    main::-webkit-scrollbar{
      width: 5px;
    }
    main::-webkit-scrollbar-track{
      background: transparent;
    }
    main::-webkit-scrollbar-thumb{
      background: rgba(52, 211, 153, 0.24);
      border-radius: 999px;
    }
    main::-webkit-scrollbar-thumb:hover{
      background: rgba(52, 211, 153, 0.42);
    }
    .screen{ display:none; flex-direction:column; gap:16px; animation: fadeInScreen .18s ease; }
    .screen.active{ display:flex; }
    @keyframes fadeInScreen{
      from{ opacity: 0.65; transform: translateY(3px); }
      to{ opacity: 1; transform: translateY(0); }
    }
    #screen-login.active{
      flex:1;
      justify-content:center;
      min-height: 100%;
    }

    /* Elevated card surfaces (fintech & security utility rhythm) */
    .card{
      background: linear-gradient(180deg, rgba(23, 35, 58, 0.92), rgba(15, 24, 42, 0.95));
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: var(--card-shadow);
      border-radius: 18px;
      padding: 16px;
    }
    .sectionCard{
      background: rgba(16, 26, 46, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 16px;
      padding: 14px 15px;
      box-shadow: 0 4px 16px rgba(2, 6, 23, 0.24);
    }
    .sessionPill{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-soft);
      background: rgba(10, 17, 32, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.18);
      padding: 4px 9px;
      border-radius: 999px;
      margin-top: 6px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .presetsPanel{
      display: none;
      flex-direction: column;
      gap: 9px;
      padding-top: 10px;
      margin-top: 2px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }
    .presetsPanel.open{
      display: flex;
    }
    .subMetaLine{
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .heroCard{
      background:
